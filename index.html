<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wawancara OTS — SAI Cipedak</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f5f6f3;--surface:#fff;--text:#20231f;--muted:#6b716b;--border:#dfe4dd;--accent:#315f45;--soft:#e7efe9;--danger:#a33b3b;--radius:16px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}.shell{max-width:1120px;margin:auto;min-height:100vh}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:17px 24px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border)}.brand h1{margin:0;font-size:18px}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}#userInfo{text-align:right;font-size:12px}#userInfo strong{display:block;font-size:13px}main{padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}.login-card{max-width:480px;margin:80px auto;padding:40px 30px;text-align:center}.login-card h2{margin-top:0}.login-card p{color:var(--muted);line-height:1.55}#googleButton{display:flex;justify-content:center;margin-top:24px}.error{color:var(--danger);margin-top:16px;font-size:14px}.loading{text-align:center;color:var(--muted);padding:70px 20px}
.toolbar{display:grid;grid-template-columns:1fr 220px;gap:12px;margin-bottom:12px}input,select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:11px;background:#fff}.result-count{color:var(--muted);font-size:13px;margin-bottom:15px}.candidate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.candidate{background:#fff;border:1px solid var(--border);border-radius:14px;padding:17px;cursor:pointer}.candidate:hover{border-color:var(--accent)}.candidate h3{margin:0 0 5px;font-size:17px}.candidate-class{color:var(--accent);font-size:13px;font-weight:700}.candidate-meta{margin-top:11px;color:var(--muted);font-size:13px;line-height:1.55}
.back{border:0;background:transparent;color:var(--accent);padding:0;margin-bottom:18px;cursor:pointer;font-weight:700}.identity h2{margin:0;font-size:28px}.identity-level{color:var(--accent);font-weight:700;margin-top:4px}.identity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}.label{color:var(--muted);font-size:12px;margin-bottom:4px}.section-title{margin:0 0 17px;font-size:18px}.assessment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.assessment{background:var(--bg);border-radius:12px;padding:14px}.assessment-value{margin-top:6px;color:var(--accent);font-size:23px;font-weight:750}
.dimension{margin-bottom:22px}.dimension:last-child{margin-bottom:0}.dimension-head{display:flex;justify-content:space-between;gap:15px;margin-bottom:7px}.dimension-name strong{display:block}.dimension-name span{color:var(--muted);font-size:12px}.dimension-score{font-weight:750}.bar{height:10px;overflow:hidden;background:#edf0ec;border-radius:99px}.bar-fill{height:100%;background:var(--accent);border-radius:99px}.dimension-description{color:var(--muted);font-size:13px;line-height:1.45;margin-top:7px}
.answer{padding:16px 0;border-top:1px solid var(--border)}.answer:first-of-type{padding-top:0;border-top:0}.answer h4{margin:0 0 7px;font-size:14px}.answer p{margin:0;line-height:1.55;white-space:pre-wrap}details{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:19px 20px;margin-bottom:18px}summary{cursor:pointer;font-weight:750}.scenario{padding-top:16px;margin-top:16px;border-top:1px solid var(--border);line-height:1.5}.scenario-number{color:var(--accent);font-size:13px;font-weight:750;margin-bottom:5px}.logout{margin-top:4px;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0;font-size:12px}
@media(max-width:650px){header{padding:14px 16px}main{padding:16px}.toolbar{grid-template-columns:1fr}.identity-grid{grid-template-columns:1fr}.identity h2{font-size:23px}.brand p{display:none}}
</style>
</head>
<body><div class="shell">
<header><div class="brand"><h1>Wawancara OTS</h1><p>Self Assessment Kesiapan Berkomunitas · SAI Cipedak</p></div><div id="userInfo" class="hidden"></div></header>
<main>
<section id="loginView" class="card login-card"><h2>Dashboard Interviewer</h2><p>Masuk menggunakan akun Google yang telah mendapatkan akses.</p><div id="googleButton"></div><div id="loginError" class="error hidden"></div></section>
<section id="loadingView" class="loading hidden">Memuat data...</section>
<section id="listView" class="hidden"><div class="toolbar"><input id="searchInput" type="search" placeholder="Cari nama anak / orang tua..."><select id="classFilter"><option value="">Semua kelas/level</option></select></div><div id="candidateCount" class="result-count"></div><div id="candidateGrid" class="candidate-grid"></div></section>
<section id="detailView" class="hidden"><button class="back" onclick="showList()">← Kembali ke daftar</button><div id="candidateDetail"></div></section>
</main></div>
<script>
const CLIENT_ID='872830180031-vb92c7lakd3m0plquudlcodift1v6g2j.apps.googleusercontent.com';
const API_URL='https://script.google.com/macros/s/AKfycbzrnNZ5J3-nSF3KD9Cd23nY2cjivUBGb-oZF_fSS8jLJl8-wR0cJz-GbjiyDq1dukwkVw/exec';
let idToken=null,currentUser=null,allCandidates=[];
window.onload=()=>{google.accounts.id.initialize({client_id:CLIENT_ID,callback:handleCredentialResponse,auto_select:false});google.accounts.id.renderButton(document.getElementById('googleButton'),{theme:'outline',size:'large',width:300,text:'signin_with'})};
async function handleCredentialResponse(response){idToken=response.credential;hideLoginError();showLoading();try{const result=await callApi('auth');currentUser=result.user;renderUser();await loadCandidates()}catch(error){idToken=null;hideLoading();document.getElementById('loginView').classList.remove('hidden');showLoginError(error.message)}}
async function callApi(action,params={}){if(!idToken)throw new Error('Sesi login tidak tersedia.');const url=new URL(API_URL);url.searchParams.set('action',action);url.searchParams.set('token',idToken);Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));const response=await fetch(url.toString(),{method:'GET',redirect:'follow'});if(!response.ok)throw new Error('Backend tidak dapat diakses.');const result=await response.json();if(!result.success)throw new Error(result.error||'Request gagal.');return result}
async function loadCandidates(){const result=await callApi('candidates');allCandidates=result.candidates||[];populateClassFilter();renderCandidates();hideLoading();document.getElementById('loginView').classList.add('hidden');document.getElementById('listView').classList.remove('hidden')}
function populateClassFilter(){const select=document.getElementById('classFilter');select.innerHTML='<option value="">Semua kelas/level</option>';[...new Set(allCandidates.map(c=>c.kelas).filter(Boolean))].sort().forEach(kelas=>{const o=document.createElement('option');o.value=kelas;o.textContent=kelas;select.appendChild(o)})}
document.getElementById('searchInput').addEventListener('input',renderCandidates);document.getElementById('classFilter').addEventListener('change',renderCandidates);
function renderCandidates(){const q=document.getElementById('searchInput').value.trim().toLowerCase(),cl=document.getElementById('classFilter').value;const f=allCandidates.filter(c=>{const h=[c.namaAnak,c.namaAyah,c.namaIbu,c.sekolahAsal].join(' ').toLowerCase();return(!q||h.includes(q))&&(!cl||c.kelas===cl)});document.getElementById('candidateCount').textContent=f.length+' calon OTS ditemukan';document.getElementById('candidateGrid').innerHTML=f.map(c=>`<article class="candidate" onclick="openCandidate(${c.row})"><h3>${escapeHtml(c.namaAnak)}</h3><div class="candidate-class">${escapeHtml(c.kelas)}</div><div class="candidate-meta">Ayah: ${escapeHtml(c.namaAyah||'-')}<br>Ibu: ${escapeHtml(c.namaIbu||'-')}</div></article>`).join('')}
async function openCandidate(row){document.getElementById('listView').classList.add('hidden');showLoading();try{const r=await callApi('candidate',{row});renderCandidateDetail(r.candidate);hideLoading();document.getElementById('detailView').classList.remove('hidden');window.scrollTo(0,0)}catch(e){hideLoading();document.getElementById('listView').classList.remove('hidden');alert(e.message)}}
function renderCandidateDetail(c){const a=c.selfAssessment.map(i=>`<div class="assessment"><div class="label">${escapeHtml(i.label)}</div><div class="assessment-value">${escapeHtml(i.value||'-')}</div></div>`).join('');const d=c.dimensions.map(i=>{const s=i.normalized===null?'-':i.normalized+'%',w=i.normalized===null?0:Math.max(0,Math.min(100,i.normalized));return `<div class="dimension"><div class="dimension-head"><div class="dimension-name"><strong>${escapeHtml(i.label)}</strong><span>${escapeHtml(i.shortLabel)}</span></div><div class="dimension-score">${s}</div></div><div class="bar"><div class="bar-fill" style="width:${w}%"></div></div><div class="dimension-description">${escapeHtml(i.description)}</div></div>`}).join('');const o=c.openAnswers.map(i=>`<div class="answer"><h4>${escapeHtml(i.title)}</h4><p>${escapeHtml(i.answer||'-')}</p></div>`).join('');const sc=c.scenarios.map(i=>`<div class="scenario"><div class="scenario-number">Skenario ${i.number}</div><div>${escapeHtml(i.answer||'-')}</div></div>`).join('');document.getElementById('candidateDetail').innerHTML=`<div class="card identity"><h2>${escapeHtml(c.identity.namaAnak)}</h2><div class="identity-level">${escapeHtml(c.identity.kelas)}</div><div class="identity-grid"><div><div class="label">Nama Ayah</div><strong>${escapeHtml(c.identity.namaAyah||'-')}</strong></div><div><div class="label">Nama Ibu</div><strong>${escapeHtml(c.identity.namaIbu||'-')}</strong></div><div><div class="label">Sekolah Asal</div><strong>${escapeHtml(c.identity.sekolahAsal||'-')}</strong></div></div></div><div class="card"><h3 class="section-title">Self Assessment</h3><div class="assessment-grid">${a}</div></div><div class="card"><h3 class="section-title">Profil Kekomunitasan</h3>${d}</div><div class="card"><h3 class="section-title">Jawaban Terbuka</h3>${o}</div><details><summary>Lihat 10 Jawaban Skenario</summary>${sc}</details>`}
function showList(){document.getElementById('detailView').classList.add('hidden');document.getElementById('listView').classList.remove('hidden');window.scrollTo(0,0)}
function renderUser(){const e=document.getElementById('userInfo');e.innerHTML=`<strong>${escapeHtml(currentUser.name||currentUser.email)}</strong>${escapeHtml(currentUser.email)}<br><button class="logout" onclick="logout()">Keluar</button>`;e.classList.remove('hidden')}
function logout(){google.accounts.id.disableAutoSelect();idToken=null;currentUser=null;allCandidates=[];document.getElementById('userInfo').classList.add('hidden');document.getElementById('listView').classList.add('hidden');document.getElementById('detailView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden')}
function showLoading(){['loginView','listView','detailView'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById('loadingView').classList.remove('hidden')}function hideLoading(){document.getElementById('loadingView').classList.add('hidden')}function showLoginError(m){const b=document.getElementById('loginError');b.textContent=m;b.classList.remove('hidden')}function hideLoginError(){document.getElementById('loginError').classList.add('hidden')}function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
</script></body></html>
